<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINSIGHTS by Himanshu Arora — Live Strategy Dashboard</title>
<style>
/* ---------- DARK (default): deep navy, data colours tuned for dark surfaces ---------- */
:root{
  color-scheme: dark;
  --bg:#0a0e1a; --bg2:#0d1326; --surface:#111a2e; --surface-2:#16213a; --surface-3:#1b2742; --border:#1f2b47; --border-2:#2a3a5e;
  --text:#e8eefb; --text-2:#9fb0cc; --text-3:#6b7a99; --strong:#ffffff;
  --teal:#2dd4bf; --cyan:#38bdf8; --pink:#f472b6; --rose:#fb7185; --green:#34d399; --amber:#fbbf24; --violet:#a78bfa; --blue:#60a5fa; --lime:#a3e635;
  --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --good-bg:rgba(52,211,153,.13); --bad-bg:rgba(251,113,133,.14); --warn-bg:rgba(251,191,36,.14); --teal-bg:rgba(45,212,191,.14); --pink-bg:rgba(244,114,182,.14); --violet-bg:rgba(167,139,250,.16); --grey-bg:rgba(159,176,204,.12); --cyan-bg:rgba(56,189,248,.14);
  /* chart series: strategy / primary benchmark / common benchmark / extra */
  --s1:#2dd4bf; --s2:#f472b6; --s3:#fbbf24; --s4:#38bdf8; --s5:#a78bfa; --s6:#a3e635; --s7:#fb7185;
  --hero-grad: linear-gradient(135deg, rgba(45,212,191,.16), rgba(56,189,248,.10) 50%, rgba(244,114,182,.12));
  --shadow: 0 10px 40px rgba(0,0,0,.35);
}
/* ---------- LIGHT: cool paper, saturated-but-darker data colours for white surfaces ---------- */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f6fb; --bg2:#eef2f9; --surface:#ffffff; --surface-2:#f3f6fb; --surface-3:#e9eef7; --border:#dfe5f0; --border-2:#c6d0e2;
  --text:#0f172a; --text-2:#475569; --text-3:#7b8aa5; --strong:#0b1120;
  --teal:#0f766e; --cyan:#0369a1; --pink:#be185d; --rose:#dc2626; --green:#15803d; --amber:#b45309; --violet:#6d28d9; --blue:#1d4ed8; --lime:#4d7c0f;
  --good:#15803d; --bad:#dc2626; --warn:#b45309;
  --good-bg:rgba(21,128,61,.10); --bad-bg:rgba(220,38,38,.09); --warn-bg:rgba(180,83,9,.10); --teal-bg:rgba(15,118,110,.10); --pink-bg:rgba(190,24,93,.09); --violet-bg:rgba(109,40,217,.10); --grey-bg:rgba(71,85,105,.09); --cyan-bg:rgba(3,105,161,.10);
  --s1:#0f766e; --s2:#be185d; --s3:#b45309; --s4:#0369a1; --s5:#6d28d9; --s6:#4d7c0f; --s7:#dc2626;
  --hero-grad: linear-gradient(135deg, rgba(15,118,110,.10), rgba(3,105,161,.07) 50%, rgba(190,24,93,.08));
  --shadow: 0 10px 30px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
body{background:
  radial-gradient(900px 520px at -10% -10%, rgba(56,189,248,.14), transparent 60%),
  radial-gradient(800px 520px at 110% 0%, rgba(167,139,250,.14), transparent 60%),
  radial-gradient(700px 500px at 50% 120%, rgba(244,114,182,.08), transparent 60%), var(--bg); min-height:100vh}
:root[data-theme="light"] body{background:
  radial-gradient(900px 520px at -10% -10%, rgba(3,105,161,.07), transparent 60%),
  radial-gradient(800px 520px at 110% 0%, rgba(109,40,217,.06), transparent 60%), var(--bg)}
a{color:var(--cyan)}
.wrap{max-width:1560px;margin:0 auto;padding:14px 22px 70px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:10px 0 14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--amber),#f59e0b);color:#1a1200;font-weight:900;font-size:12px;display:grid;place-items:center;letter-spacing:.02em;box-shadow:0 0 26px rgba(251,191,36,.28)}
h1{font-size:20px;margin:0;letter-spacing:.16em;text-transform:uppercase;font-weight:900}
h1 em{font-style:normal;color:var(--text-2);font-weight:500;letter-spacing:.02em;text-transform:none;font-size:14px;margin-left:10px}
h1 small{display:block;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text-2);font-size:12px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--text-2);font-size:12.5px;align-items:center}
.meta b{color:var(--text)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.live{background:var(--good-bg);color:var(--green);box-shadow:0 0 0 1px rgba(52,211,153,.35) inset}
.pill.closed{background:var(--grey-bg);color:var(--text-2)}
.pill.stale{background:var(--warn-bg);color:var(--amber)}
button{font:inherit;cursor:pointer;border:1px solid var(--border-2);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 13px}
button:hover{border-color:var(--teal);color:var(--strong)}
.theme{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;color:var(--text-2);cursor:pointer;user-select:none}
.theme .knob{width:34px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;border:1px solid var(--border-2)}
.theme .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--cyan));transition:left .15s}
:root[data-theme="light"] .theme .knob::after{left:16px;background:linear-gradient(135deg,var(--amber),#f59e0b)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface-3);color:var(--text);border:1px solid var(--border-2);border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow);z-index:9;display:none;max-width:90vw;text-align:center}
.toast b{color:var(--strong)}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid rgba(251,191,36,.35);font-size:13px}
.banner summary{cursor:pointer;font-weight:600;color:var(--amber)}
.banner ul{margin:8px 0 0;padding-left:18px;color:var(--text-2)}
.banner.err{background:var(--bad-bg);border-color:rgba(251,113,133,.4)} .banner.err summary{color:var(--rose)}
/* navigation */
nav.pages{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:10px}
nav.pages button{border:1px solid transparent;background:transparent;color:var(--text-2);padding:8px 14px;border-radius:10px;font-weight:700;letter-spacing:.02em;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
nav.pages button small{font-weight:500;font-size:10.5px;color:var(--text-3);letter-spacing:.02em}
nav.pages button:hover{background:var(--surface);color:var(--text)}
nav.pages button.on{background:var(--surface);color:var(--strong);border-color:var(--border-2);box-shadow:0 0 0 1px var(--teal) inset}
nav.pages button.on small{color:var(--teal)}
nav.pages .sep{width:1px;background:var(--border-2);margin:6px 6px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.switch{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px;width:max-content}
.switch button{border:none;background:transparent;color:var(--text-2);padding:8px 16px;border-radius:9px;font-weight:700;letter-spacing:.03em;font-size:12.5px}
.switch button.on{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#04121a}
:root[data-theme="light"] .switch button.on{color:#ffffff}
.switch button small{display:block;font-weight:500;letter-spacing:0;font-size:11px;opacity:.85}
.pos{color:var(--green)} .neg{color:var(--rose)} .mut{color:var(--text-3)} td.strong{font-weight:800}
section{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.sec-h .num{width:28px;height:28px;border-radius:8px;background:var(--teal-bg);color:var(--teal);font-weight:800;display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 1px rgba(45,212,191,.35) inset}
.sec-h h2{font-size:18px;margin:0;font-weight:800}
.sec-h .desc{font-size:12px;color:var(--text-2)}
h3{font-size:11.5px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-2);font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0;overflow:hidden}
.tblwrap{overflow-x:auto;max-height:640px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;user-select:none;z-index:1}
th.l,td.l{text-align:left}
th:hover{color:var(--teal)}
th .arrow{opacity:.7;font-size:9px;margin-left:3px;color:var(--teal)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(56,189,248,.06)}
td.sym{font-weight:700;text-align:left;color:var(--strong)}
td.sym small{display:block;font-weight:400;color:var(--text-3);font-size:11px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px;color:var(--text-3);font-size:13px;text-align:center}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em}
.tag.exit{background:var(--bad-bg);color:var(--rose)} .tag.entry{background:var(--good-bg);color:var(--green)} .tag.scale{background:var(--warn-bg);color:var(--amber)}
.tag.held{background:var(--teal-bg);color:var(--teal)} .tag.armed{background:var(--violet-bg);color:var(--violet)} .tag.pink{background:var(--pink-bg);color:var(--pink)}
.tag.grey{background:var(--grey-bg);color:var(--text-2)} .tag.today{background:var(--rose);color:#fff} .tag.noslot{background:var(--grey-bg);color:var(--text-2)} .tag.cyan{background:var(--cyan-bg);color:var(--cyan)}
.ok{color:var(--green);font-weight:700} .no{color:var(--text-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--strong)}
.kpi .k{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-top:6px;font-weight:700}
.kpi .d{font-size:11.5px;color:var(--text-2);margin-top:3px}
.kpi .v.teal{color:var(--teal)} .kpi .v.cyan{color:var(--cyan)} .kpi .v.pink{color:var(--pink)} .kpi .v.green{color:var(--green)} .kpi .v.amber{color:var(--amber)} .kpi .v.rose{color:var(--rose)} .kpi .v.violet{color:var(--violet)}
.perf{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1000px){.perf,.two{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px 8px}
.chart .t{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chart .t b{font-size:13.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
svg{display:block;width:100%;height:auto}
.tt{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border-2);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:5;white-space:nowrap;color:var(--text)}
.stats{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 16px}
.stats div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.stats div:last-child{border-bottom:none}
.stats span:first-child{color:var(--text-2)}
.stats span:last-child{font-variant-numeric:tabular-nums;font-weight:700;color:var(--strong)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.toolbar input{font:inherit;padding:7px 12px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface);color:var(--text);min-width:240px}
.toolbar input:focus{outline:none;border-color:var(--teal)}
.toolbar .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--text-2)}
.chip.on{background:var(--teal);color:#04121a;border-color:var(--teal);font-weight:700}
:root[data-theme="light"] .chip.on{color:#fff}
.note{font-size:12px;color:var(--text-3);margin-top:8px;line-height:1.5}
footer{margin-top:34px;color:var(--text-3);font-size:12px;border-top:1px solid var(--border);padding-top:12px;line-height:1.6}
.stopbar{display:inline-block;width:70px;height:6px;background:var(--surface-3);border-radius:3px;vertical-align:middle;margin-left:6px;position:relative;overflow:hidden}
.stopbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
#loading{padding:60px;text-align:center;color:var(--text-2);line-height:1.7}
.hero{background:var(--hero-grad);border:1px solid var(--border-2);border-radius:14px;padding:14px 18px;margin-bottom:12px;font-size:13.5px;color:var(--text-2)}
.hero b{color:var(--strong)}
/* overview */
.ov-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:16px}
@media (max-width:1000px){.ov-hero{grid-template-columns:1fr}}
.ov-title{background:var(--hero-grad);border:1px solid var(--border-2);border-radius:16px;padding:22px 24px}
.ov-title h2{margin:0 0 6px;font-size:26px;letter-spacing:-.01em;color:var(--strong)}
.ov-title p{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.6;max-width:70ch}
.ov-title .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ov-title .row span{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text-2)}
.ov-title .row span b{color:var(--strong)}
.alerts{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.alerts h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-2)}
.alerts .a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.alerts .a:last-child{border-bottom:none}
.alerts .a b{color:var(--strong)}
.gridcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),var(--cyan),var(--pink))}
.scard:hover{border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.scard .n{font-weight:800;font-size:15px;color:var(--strong);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.scard .n small{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.scard .u{color:var(--text-2);font-size:12px;margin-top:2px}
.scard .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.scard .m div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.scard .m b{display:block;font-size:16px;font-variant-numeric:tabular-nums;color:var(--strong)}
.scard .m span{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:200px 1fr 70px;gap:10px;align-items:center;font-size:12.5px}
.bar .lbl{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:12px;background:var(--surface-3);border-radius:6px;overflow:hidden;position:relative}
.bar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--strong)}
@media (max-width:700px){.bar{grid-template-columns:120px 1fr 60px}}

/* comparison / analytics additions */
:root{--good-rgb:52,211,153; --bad-rgb:251,113,133; --hm-alpha:.78}
:root[data-theme="light"]{--good-rgb:21,128,61; --bad-rgb:220,38,38; --hm-alpha:.55}
.pagehead{margin:16px 0 4px}
.pagehead h2{margin:0 0 4px;font-size:24px;letter-spacing:-.01em;color:var(--strong)}
.pagehead .tag2{font-size:12.5px;color:var(--text-2)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sbadge{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--surface-3);padding:3px 10px;border-radius:999px}
:root[data-theme="dark"] .sbadge, :root:not([data-theme="light"]) .sbadge{color:#06101c}
.sbadge:not([style]){color:var(--text-2)!important;border:1px solid var(--border-2)}
.controls .lbl{display:block;font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
select{font:inherit;padding:9px 34px 9px 12px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%239fb0cc' stroke-width='1.6'/></svg>") no-repeat right 12px center;color:var(--text);font-weight:700;min-width:260px;appearance:none;cursor:pointer}
select:focus{outline:none;border-color:var(--teal)}
i.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
tr.best td{background:var(--good-bg)} tr.bench td{background:var(--warn-bg)} tr.sel td{background:var(--teal-bg)} tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.tblwrap.nomax{max-height:none}
td.best{color:var(--green);font-weight:800} td.bench, th.bench{background:var(--warn-bg)}
table.metrics th small{display:block;font-weight:500;font-size:10px;letter-spacing:0;text-transform:none;color:var(--text-3)}
table.metrics td:first-child{color:var(--text-2);font-weight:600}
.hmwrap{max-height:none;padding:10px 12px}
table.hm{border-collapse:separate;border-spacing:3px;font-size:11px;width:100%}
table.hm th{position:static;background:var(--surface-2);color:var(--text-2);padding:5px 6px;text-align:center;border-radius:5px;font-size:10px;cursor:default}
table.hm td{padding:6px 5px;text-align:center;border-radius:5px;border:none;min-width:40px;font-weight:600;color:var(--strong)}
table.hm td.y{background:var(--surface-3);font-weight:800;color:var(--text)}
table.hm td.e{background:var(--surface-2);opacity:.5}
.scard::before{background:var(--accent, linear-gradient(90deg,var(--teal),var(--cyan),var(--pink)))}
.scard .m{grid-template-columns:repeat(3,1fr)}
.scard .m b{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">FIN</div>
      <h1>FINSIGHTS <em>by Himanshu Arora</em><small>live strategy dashboard · six model portfolios · live books, realised &amp; unrealised P&amp;L, 2016→today backtests</small></h1>
    </div>
    <div class="meta" id="meta"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="mut" id="autoref" style="font-size:12px"></span>
      <button id="refresh" title="Re-reads the latest build published by GitHub. Prices update when GitHub rebuilds (every 15 min in market hours).">↻ Refresh now</button>
      <span class="theme" id="theme" title="Switch light / dark theme"><span id="themeLabel">Dark</span><span class="knob"></span></span>
    </div>
  </header>
  <div id="warnings"></div>
  <div id="loading">Loading latest data…</div>
  <nav class="pages" id="nav" hidden></nav>
  <div class="controls" id="controls"></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="tt" id="tt"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = (s, el=document) => el.querySelector(s);

function readHash(){ const h=(location.hash||'#overview').slice(1).split('/'); ROUTE.page=h[0]||'overview'; if(isMom(ROUTE.page)){ ROUTE.uni=h[1]||null; ROUTE.view=h[2]||'live'; } else { ROUTE.view=h[1]||'live'; } }

async function load(){
  try{
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
    DATA.bench2_short = 'Nifty 200 Mom 30';
    render();
  }catch(e){
    $('#loading').innerHTML = '<b>No data yet</b> (' + e.message + ').<br><br>If this is a fresh setup: go to the repository → <b>Actions</b> → <b>Run workflow</b>, wait ~6 minutes, then reload this page.<br>If you opened index.html from your disk, open the GitHub Pages URL instead — a browser cannot read data.json from a local file.';
  }
}

function sortable(table, rows, cols, renderRow, defaultKey, defaultDesc){
  let key=defaultKey, desc=!!defaultDesc;
  const thead = el('thead'); const tbody = el('tbody');
  const draw = () => {
    const rs = rows.slice();
    const gv = (o,k) => k.indexOf('.')<0 ? o[k] : k.split('.').reduce((v,kk)=>v==null?undefined:v[kk], o);
    if(key){ rs.sort((a,b)=>{ const x=gv(a,key), y=gv(b,key); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (typeof x==='number'? x-y : String(x).localeCompare(String(y))) * (desc?-1:1); }); }
    tbody.replaceChildren(...rs.map(renderRow));
    thead.querySelectorAll('th').forEach(th=>{ const a=th.querySelector('.arrow'); if(a) a.textContent = th.dataset.key===key ? (desc?'▼':'▲') : ''; });
  };
  const tr = el('tr');
  for(const c of cols){
    const th = el('th', {class: c.left?'l':'', 'data-key': c.key||'', title: c.title||''}, c.label, el('span', {class:'arrow'}, ''));
    if(c.key) th.addEventListener('click', ()=>{ if(key===c.key) desc=!desc; else {key=c.key; desc = c.desc!==false;} draw(); });
    tr.append(th);
  }
  thead.append(tr); table.append(thead, tbody); draw();
  return draw;
}

  sortable(table, rows, cols, renderRow, sortKey, sortDesc); wrap.append(table); card.append(wrap); return card;
}

// =============================================================== ANALYTICS (month-end basis, computed in the browser from each book's history)
const SCOL = {CORE:'var(--s1)', PRECISION:'var(--s4)', FRONTIER:'var(--s6)', SPECTRUM:'var(--s5)', S1:'var(--s2)', S4PLUS:'var(--s7)'};
const BENCH2_COL = 'var(--s3)', OWNB_COL = 'var(--text-3)';
const OV = {metric:'cagr', uni:null};
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const rets = a => a.map((v,i)=> i===0 || v==null || a[i-1]==null || !a[i-1] ? null : v/a[i-1]-1);
const rolling = (a,k) => a.map((v,i)=> i<k || v==null || a[i-k]==null || !a[i-k] ? null : v/a[i-k]-1);
const drawdown = a => { let pk=-Infinity; return a.map(v=>{ if(v==null) return null; pk=Math.max(pk,v); return (v/pk-1)*100; }); };
const mean = xs => xs.length? xs.reduce((s,x)=>s+x,0)/xs.length : null;
const stdev = xs => { if(xs.length<2) return null; const m=mean(xs); return Math.sqrt(xs.reduce((s,x)=>s+(x-m)*(x-m),0)/(xs.length-1)); };
// collapse a daily/monthly history into one point per calendar month (the last available session of that month)
function monthly(H){
  const by = new Map();
  for(const h of H){ if(h.nav==null) continue; by.set(h.date.slice(0,7), h); }
  const ym = [...by.keys()].sort();
  return {ym, dates: ym.map(k=>by.get(k).date), nav: ym.map(k=>by.get(k).nav), bench: ym.map(k=>by.get(k).bench ?? null), bench2: ym.map(k=>by.get(k).bench2 ?? null),
          n: ym.map(k=>by.get(k).n ?? null), exposure: ym.map(k=>by.get(k).exposure_pct ?? null)};
}
const rebase = (arr, to=100) => { const b = arr.find(v=>v!=null); return arr.map(v=> (v==null||!b)? null : v/b*to); };
function yearsBetween(d0, d1){ return (new Date(d1) - new Date(d0)) / (365.25*864e5); }
// return-series statistics for one series (and optionally against a benchmark series)
function stats(dates, nav, bench){
  const out = {};
  const first = nav.findIndex(v=>v!=null), last = nav.length-1;
  if(first<0 || last<=first) return out;
  const yrs = yearsBetween(dates[first], dates[last]);
  out.years = yrs; out.total_return = (nav[last]/nav[first]-1)*100;
  out.cagr = yrs>0 ? (Math.pow(nav[last]/nav[first], 1/yrs)-1)*100 : null;
  const dd = drawdown(nav); out.mdd = Math.min(...dd.filter(v=>v!=null));
  out.calmar = (out.cagr!=null && out.mdd<0) ? out.cagr/Math.abs(out.mdd) : null;
  const r = rets(nav); const rs = r.filter(v=>v!=null);
  const sd = stdev(rs); out.vol = sd!=null? sd*Math.sqrt(12)*100 : null; out.sharpe = (sd? mean(rs)/sd*Math.sqrt(12) : null);
  out.pos_months = rs.length? rs.filter(v=>v>0).length/rs.length*100 : null; out.months = rs.length;
  out.best_month = rs.length? Math.max(...rs)*100 : null; out.worst_month = rs.length? Math.min(...rs)*100 : null;
  if(bench){
    const rb = rets(bench); const up=[], upb=[], dn=[], dnb=[];
    r.forEach((v,i)=>{ const b=rb[i]; if(v==null||b==null) return; if(b>0){ up.push(v); upb.push(b); } else if(b<0){ dn.push(v); dnb.push(b); } });
    out.up_capture = upb.length && mean(upb) ? mean(up)/mean(upb)*100 : null;
    out.down_capture = dnb.length && mean(dnb) ? mean(dn)/mean(dnb)*100 : null;
    const bs = stats(dates, bench); out.bench = bs; out.excess_cagr = (out.cagr!=null && bs.cagr!=null)? out.cagr-bs.cagr : null;
  }
  return out;
}
// metric catalogue for the comparison page: key, label, unit, better ('high' | 'low'), source ('stat' = month-end analytics, 'eng' = engine trade stats), benchmark applicable
const METS = [
  ['cagr','CAGR','%','high','stat',true], ['total_return','Total return','%','high','stat',true], ['mdd','Max drawdown','%','high','stat',true],
  ['calmar','Calmar','x','high','stat',true], ['sharpe','Sharpe','x','high','stat',true], ['vol','Volatility (ann.)','%','low','stat',true],
  ['up_capture','Up capture','%','high','stat',false], ['down_capture','Down capture','%','low','stat',false],
  ['excess_cagr','Excess vs '+'__B2__','%','high','stat',false], ['excess_own','Excess vs own benchmark','%','high','eng',false], ['own_bench_cagr','Own benchmark CAGR','%','high','eng',false],
  ['pos_months','Positive months','%','high','stat',true], ['best_month','Best month','%','high','stat',true], ['worst_month','Worst month','%','high','stat',true],
  ['win_rate','Win rate','%','high','eng',false], ['profit_factor','Profit factor','x','high','eng',false], ['avg_hold','Avg holding (months)','mo','high','eng',false], ['trades','Closed positions','#','high','eng',false],
  ['realised','Realised P&L','₹','high','eng',false], ['unrealised','Unrealised P&L','₹','high','eng',false], ['final_value','Final value','₹','high','eng',false]];
const MET = Object.fromEntries(METS.map(m=>[m[0], {label:m[1], unit:m[2], better:m[3], src:m[4], bench:m[5]}]));
function fmtM(v, key){ if(v==null || Number.isNaN(v)) return '—'; const u=MET[key].unit;
  if(u==='%') return (key==='excess_cagr'||key==='excess_own') ? fPct(v) : v.toFixed(2)+'%';
  if(u==='x') return v.toFixed(2)+'×'; if(u==='mo') return v.toFixed(1); if(u==='#') return inr.format(Math.round(v)); if(u==='₹') return fR(v); return fN(v); }
// one comparable record per backtest book
function btRecord(key, name, alias, color, capital, benchName, H, eng){
  const m = monthly(H); const S = stats(m.dates, m.nav, m.bench2); const own = stats(m.dates, m.nav, m.bench);
  return {key, name, alias, color, capital, benchName, m, S,
    vals: {cagr:S.cagr, total_return:S.total_return, mdd:S.mdd, calmar:S.calmar, sharpe:S.sharpe, vol:S.vol, up_capture:S.up_capture, down_capture:S.down_capture,
      excess_cagr:S.excess_cagr, excess_own:own.excess_cagr, own_bench_cagr: own.bench? own.bench.cagr:null, pos_months:S.pos_months, best_month:S.best_month, worst_month:S.worst_month,
      win_rate:eng.win_rate, profit_factor:eng.profit_factor, avg_hold:eng.avg_hold, trades:eng.trades, realised:eng.realised, unrealised:eng.unrealised, final_value:eng.final_value}};
}
function unrealisedOf(list){ return list.reduce((s,h)=> s + (h.unrealised||0), 0); }
function momEng(B){ const m=B.metrics; return {win_rate:m.win_rate_pct, profit_factor:m.profit_factor, avg_hold:m.avg_holding_months, trades:m.closed_trades, realised:m.realised_pnl, unrealised:unrealisedOf(B.holdings), final_value:m.final_value}; }
function asEng(B){ const m=B.metrics; return {win_rate:m.win_rate_pct, profit_factor:m.profit_factor, avg_hold:m.avg_holding_months, trades:m.total_trades, realised:m.realised_pnl, unrealised:m.unrealised_pnl, final_value:m.final_value}; }
// the comparison set: four Anchor & Sail books + the two momentum books on the selected universe
function comparisonSet(){
  const D=DATA, uni = OV.uni && D.momentum.strategies.S1.universes[OV.uni] ? OV.uni : D.momentum.default_universe; OV.uni = uni;
  const recs=[];
  for(const [k,P] of Object.entries(D.portfolios)) if(P.backtest) recs.push(btRecord(k, P.display, k, SCOL[k], P.backtest.capital, P.benchmark, P.backtest.history, asEng(P.backtest)));
  for(const [k,Sx] of Object.entries(D.momentum.strategies)){ const U=Sx.universes[uni]; recs.push(btRecord(k, Sx.name, `${Sx.code} · ${U.universe_label}`, SCOL[k], D.momentum.capital, U.benchmark, U.backtest.history, momEng(U.backtest))); }
  // common yardstick as its own record (month-end, from the longest history)
  const ref = recs.reduce((a,b)=> a.m.ym.length>=b.m.ym.length? a:b);
  const bm = monthly(ref.m.dates.map((d,i)=>({date:d, nav:ref.m.bench2[i]}))); const BS = stats(bm.dates, bm.nav);
  const bench = {key:'B2', name:D.bench2_short, color:BENCH2_COL, m:bm, S:BS, vals:{cagr:BS.cagr, total_return:BS.total_return, mdd:BS.mdd, calmar:BS.calmar, sharpe:BS.sharpe, vol:BS.vol, pos_months:BS.pos_months, best_month:BS.best_month, worst_month:BS.worst_month}};
  return {recs, bench, uni};
}

// ---------------------------------------------------------------- heat-map tables (theme-aware colours read from CSS variables)
function heatColor(v, amax){
  if(v==null || Number.isNaN(v)) return 'transparent';
  const cs = getComputedStyle(document.documentElement); const rgb = cs.getPropertyValue(v>=0?'--good-rgb':'--bad-rgb').trim() || (v>=0?'52,211,153':'251,113,133');
  const maxA = parseFloat(cs.getPropertyValue('--hm-alpha')) || .8; const t = Math.min(1, Math.abs(v)/(amax||1));
  return `rgba(${rgb},${(0.08 + t*(maxA-0.08)).toFixed(3)})`;
}
function heatMonthly(ym, vals, {yearCol=true}={}){
  const grid={}; let amax=0.01;
  ym.forEach((k,i)=>{ const v=vals[i]; if(v==null) return; const [y,mo]=k.split('-').map(Number); (grid[y]=grid[y]||{})[mo]=v*100; amax=Math.max(amax, Math.abs(v*100)); });
  const years=Object.keys(grid).sort(); const cap = Math.min(amax, 15);
  const t = el('table',{class:'hm'}); const th = el('tr',{}, el('th',{},'Year'), ...MN.map(x=>el('th',{},x)), yearCol? el('th',{},'Year'):null); t.append(el('thead',{},th));
  const tb = el('tbody');
  for(const y of years){ const tr=el('tr',{}, el('td',{class:'y'}, y)); let acc=1, any=false;
    for(let mo=1;mo<=12;mo++){ const v=grid[y][mo]; if(v==null){ tr.append(el('td',{class:'e'})); continue; } acc*=(1+v/100); any=true; tr.append(el('td',{style:`background:${heatColor(v,cap)}`, title:`${MN[mo-1]} ${y}: ${fPct(v)}`}, v.toFixed(1))); }
    if(yearCol) tr.append(el('td',{class:'y '+cls(any?acc-1:null)}, any? ((acc-1)*100).toFixed(1) : ''));
    tb.append(tr); }
  t.append(tb); return el('div',{class:'card'}, el('div',{class:'tblwrap hmwrap nomax'}, t));
}
function heatQuarterly(ym, vals){
  const grid={}; ym.forEach((k,i)=>{ const v=vals[i]; if(v==null) return; const [y,mo]=k.split('-').map(Number); const q=Math.floor((mo-1)/3)+1; grid[y]=grid[y]||{}; grid[y][q]=(grid[y][q]??1)*(1+v); });
  const years=Object.keys(grid).sort(); let amax=0.01; years.forEach(y=>{ for(let q=1;q<=4;q++) if(grid[y][q]!=null) amax=Math.max(amax, Math.abs((grid[y][q]-1)*100)); }); const cap=Math.min(amax, 30);
  const t = el('table',{class:'hm'}); t.append(el('thead',{}, el('tr',{}, el('th',{},'Year'), el('th',{},'Q1'), el('th',{},'Q2'), el('th',{},'Q3'), el('th',{},'Q4'))));
  const tb=el('tbody'); for(const y of years){ const tr=el('tr',{}, el('td',{class:'y'}, y)); for(let q=1;q<=4;q++){ const g=grid[y][q]; if(g==null){ tr.append(el('td',{class:'e'})); continue; } const p=(g-1)*100; tr.append(el('td',{style:`background:${heatColor(p,cap)}`}, p.toFixed(1))); } tb.append(tr); }
  t.append(tb); return el('div',{class:'card'}, el('div',{class:'tblwrap hmwrap nomax'}, t));
}

// ---------------------------------------------------------------- bar + bubble charts (SVG, theme colours via CSS variables)
const svgNS = (t, a={}) => { const e=document.createElementNS('http://www.w3.org/2000/svg', t); for(const [k,v] of Object.entries(a)) e.setAttribute(k,v); return e; };
function barChart({title, sub, items, fmt, height=300}){
  const card = el('div',{class:'chart'}); card.append(el('div',{class:'t'}, el('b',{}, title), sub? el('span',{class:'mut', style:'font-size:12px'}, sub):null));
  const vals = items.map(i=>i.value).filter(v=>v!=null); if(!vals.length){ card.append(el('div',{class:'empty'},'No data.')); return card; }

function openBookTable(rows, withWr){
  const cols = [
      {label:'Stock', left:true, key:'symbol'}, {label:'Entry date', key:'entry_date'}, {label:'Entry ₹', key:'entry'}, {label:'Qty held', key:'qty_open'},
      {label:'LTP ₹', key:'ltp'}, {label:'P&L %', key:'pnl_pct'}, {label:'Unrealised ₹', key:'unrealised'}, {label:'Value ₹', key:'value'}, {label:'Stop ₹', key:'stop'},
      {label:'LTP above stop', key:'to_stop_pct', desc:false, title:'How far the last price sits above the stop. Red when within 5%.'},
      {label:'Target ₹', key:'target'}, {label:'To target', key:'to_target_pct'}, {label:'Scaled', key:'scaled'}];
  if(withWr) cols.push({label:'Day low', key:'day_low'}, {label:'%R now', key:'wr_p', title:'Running-month %R(14), provisional'}); else cols.push({label:'Months held', key:'months'});
  return tableCard(rows, cols,
    r => { const tr=el('tr'); const near = r.to_stop_pct!=null && r.to_stop_pct<=5;
        const bar = el('span',{class:'stopbar'}); const w = r.to_stop_pct==null?0:Math.max(0,Math.min(100, r.to_stop_pct/20*100)); bar.append(el('i',{style:`width:${w}%;background:${near?'var(--rose)':'var(--teal)'}`}));
        tr.append(symCell(r), td(r.entry_date), td(fP(r.entry)), td(inr.format(r.qty_open)), td(fP(r.ltp)), pctCell(r.pnl_pct), td(fR(r.unrealised), cls(r.unrealised)), td(fR(r.value)),
          td(fP(r.stop)), el('td',{class: near?'neg':''}, fPct(r.to_stop_pct,false), bar), td(fP(r.target)),
          td(r.to_target_pct==null?(r.scaled?'done':'—'):fPct(r.to_target_pct,false)), el('td',{}, r.scaled? el('span',{class:'tag scale'},'50% OUT'):'·'));
        if(withWr) tr.append(td(fP(r.day_low)), td(fP(r.wr_p))); else tr.append(td(r.months));
        return tr; },
    'No open positions.', 'to_stop_pct', false);
}

  M.append(el('div',{class:'hero'}, el('b',{}, `${Sx.name} · ${U.universe_label}`), ` — rebalanced monthly from `, el('b',{}, m.start), ` with ₹${inr.format(D.momentum.capital)}, the same rules and every charge, the book would be worth `, el('b',{}, fR(m.final_value)), ` today (${m.as_of}) — a CAGR of `, el('b',{}, fPct(m.cagr_pct,false)), ` over ${m.years} years versus `, el('b',{}, fPct(m.bench_cagr_pct,false)), ` for the ${U.benchmark} and `, el('b',{}, fPct(m.bench2_cagr_pct,false)), ` for the ${D.bench2_short}.`,
    B.published_cagr_pct!=null? el('span',{class:'mut'}, ` The FINSIGHTS package reported ${fPct(B.published_cagr_pct,false)} for this strategy/universe on its own (hand-typed) list and Yahoo sectors; this build uses NSE's official constituents and sector classification.`):null));
  const unreal = unrealisedOf(B.holdings);
  btAnalytics(M, {name:Sx.name, color, capital:D.momentum.capital, benchName:U.benchmark, H:B.history, start:m.start, asOf:m.as_of, mddDaily:m.max_dd_pct,
    eng:{win_rate:m.win_rate_pct, wins:m.wins, trades:m.closed_trades, profit_factor:m.profit_factor, avg_hold:m.avg_holding_months, realised:m.realised_pnl, unrealised:unreal, final_value:m.final_value},
    charges:m.charges_paid, interest:m.interest_earned, trades:B.trades.map(normMom),
    extraKpis:[kpi(fPct(m.avg_win_pct),'Avg win','per winning position, net','green'), kpi(fPct(m.avg_loss_pct),'Avg loss','per losing position, net','rose'), kpi(fPct(m.avg_exposure_pct,false),'Avg exposure',`${m.months_derisked} de-risked month${m.months_derisked===1?'':'s'}`,''), kpi(m.rebalances,'Rebalances',`${m.open_positions} positions open now`,'')],
    rightChart:(mm)=> lineChart({title: isS4? 'Target exposure at each rebalance (%)':'Stocks held', dates:mm.dates, series:[{name: isS4?'Exposure':'Held', color:'var(--cyan)', values: isS4? mm.exposure : mm.n}], fmt:v=> isS4? Math.round(v)+'%' : String(Math.round(v)), area:true, base:0, minPts:2, height:260, yMax: isS4?100:D.momentum.rules.hold, padBottom:false})});
  const s6 = el('section'); s6.append(secHead('6','Year by year','calendar-year returns of the book, its benchmark and the common yardstick'));
  s6.append(tableCard(B.yearly, [{label:'Year', left:true, key:'year', desc:false}, {label:Sx.name, key:'port_pct'}, {label:U.benchmark, key:'bench_pct'}, {label:'Excess', key:'excess_pct'}, {label:D.bench2_short, key:'bench2_pct'}, {label:'Book value at year end', key:'nav_end'}, {label:'Positions closed', key:'trades'}, {label:'Wins', key:'wins'}, {label:'Avg exposure', key:'avg_exposure_pct'}],
    r => { const tr=el('tr'); tr.append(td(r.year,'l'), pctCell(r.port_pct), pctCell(r.bench_pct), pctCell(r.excess_pct), pctCell(r.bench2_pct), td(fR(r.nav_end)), td(r.trades), td(r.wins), td(fPct(r.avg_exposure_pct,false))); return tr; }, 'No yearly data.', 'year', false));
  M.append(s6);
  const s7 = el('section'); s7.append(secHead('7','What the backtest holds today', `${B.holdings.length} stocks · ${lakh(m.invested_now)} invested · ${lakh(m.cash_now)} in the liquid fund · unrealised ${fR(unreal)}`));
  s7.append(tableCard(B.holdings, [{label:'Stock', left:true, key:'symbol'}, {label:'Sector', left:true, key:'industry'}, {label:'Shares', key:'shares'}, {label:'Avg entry ₹', key:'avg_entry'}, {label:'Since', key:'entry_date'}, {label:'LTP ₹', key:'ltp'}, {label:'Value ₹', key:'value'}, {label:'Weight', key:'weight_pct'}, {label:'P&L %', key:'pnl_pct'}, {label:'Unrealised ₹', key:'unrealised'}, {label:'Rank today', key:'rank_now', desc:false}],
    r => { const tr=el('tr'); tr.append(symCell(r), td(r.industry,'l'), td(inr.format(r.shares)), td(fP(r.avg_entry)), td(r.entry_date), td(fP(r.ltp)), td(fR(r.value)), td(fPct(r.weight_pct,false)), pctCell(r.pnl_pct), td(fR(r.unrealised), cls(r.unrealised)), td(r.rank_now ?? '—')); return tr; }, 'No holdings.', 'weight_pct', true));
  M.append(s7);
  const s8 = el('section'); s8.append(secHead('8','Trade log', `${B.trades.length} closed positions since ${m.start} · realised ${fR(m.realised_pnl)}`));
  const tb = el('div',{class:'toolbar'}); const inp = el('input',{placeholder:'Filter symbol / reason…', type:'search'}); const holder = el('div'); let q='';
  const draw = () => { const rows = B.trades.filter(t=>!q || t.symbol.toLowerCase().includes(q) || (t.reason||'').toLowerCase().includes(q));
    holder.replaceChildren(tableCard(rows, [{label:'Stock', left:true, key:'symbol'}, {label:'Entry', key:'entry_date'}, {label:'Avg entry ₹', key:'avg_entry'}, {label:'Exit', key:'exit_date'}, {label:'Avg exit ₹', key:'avg_exit'}, {label:'Shares', key:'shares'}, {label:'Invested ₹', key:'invested'}, {label:'Months', key:'months'}, {label:'Return %', key:'return_pct'}, {label:'Net P&L ₹', key:'net_pnl'}, {label:'Costs ₹', key:'costs'}, {label:'Reason', key:'reason', left:true}],
      r => { const tr=el('tr'); tr.append(el('td',{class:'sym'}, r.symbol), td(r.entry_date), td(fP(r.avg_entry)), td(r.exit_date), td(fP(r.avg_exit)), td(inr.format(r.shares)), td(fR(r.invested)), td(r.months), pctCell(r.return_pct), td(fR(r.net_pnl), cls(r.net_pnl)), td(fR(r.costs)), td(r.reason,'l')); return tr; }, 'No trades match.', 'exit_date', true)); };
  inp.addEventListener('input', ()=>{ q=inp.value.trim().toLowerCase(); draw(); }); tb.append(inp); s8.append(tb, holder); draw(); M.append(s8);
}

function lineChart({title, dates, series, fmt, base, area=false, extra, minPts=2, height=280, yMax, wide=false, padTop=true, padBottom=true, log=false}){
  const card = el('div', {class:'chart'});
  card.append(el('div', {class:'t'}, el('b', {}, title), el('div', {class:'legend'}, ...series.map(s=>el('span',{}, el('i',{style:`background:${s.color}`}), s.name)))));
  const n = dates.length;
  if(n < minPts){ card.append(el('div',{class:'empty'}, 'The curve appears once there are at least two data points.')); return card; }
  const W=wide?1240:760, Hh=height, pl=wide?70:58, pr=14, pt=14, pb=28;
  const vals = series.flatMap(s=>s.values).filter(v=>v!=null);
  const useLog = log && vals.every(v=>v>0);
  const T = useLog ? Math.log : (v=>v), Ti = useLog ? Math.exp : (v=>v);
  let lo=Math.min(...vals), hi=Math.max(...vals); if(yMax!=null) hi=Math.max(hi,yMax); if(base!=null){ lo=Math.min(lo,base); hi=Math.max(hi,base);}
  lo=T(lo); hi=T(hi); const pad=(hi-lo)*0.06||1; if(padBottom) lo-=pad; if(padTop) hi+=pad;
  const x = i => pl + (W-pl-pr) * (n===1?0:i/(n-1));
  const y = v => pt + (Hh-pt-pb) * (1 - (T(v)-lo)/(hi-lo));
  const ns = (t, a) => { const e=document.createElementNS('http://www.w3.org/2000/svg', t); for(const [k,v] of Object.entries(a)) e.setAttribute(k,v); return e; };
  const svg = ns('svg', {viewBox:`0 0 ${W} ${Hh}`});
  let tickVals;
  if(useLog){ tickVals=[]; const a=Math.exp(lo), b=Math.exp(hi); let e=Math.pow(10, Math.floor(Math.log10(a)));
    while(e<=b){ for(const m of [1,2,5]){ const v=m*e; if(v>=a && v<=b) tickVals.push(v); } e*=10; }
    if(tickVals.length>7){ const step=Math.ceil(tickVals.length/7); tickVals=tickVals.filter((_,i)=>i%step===0); }
    if(tickVals.length<2) tickVals=[0,1,2,3,4].map(k=>Ti(lo+(hi-lo)*k/4)); }
  else tickVals=[0,1,2,3,4].map(k=>lo+(hi-lo)*k/4);
  for(const v of tickVals){ svg.append(ns('line',{x1:pl,x2:W-pr,y1:y(v),y2:y(v),stroke:'var(--border)','stroke-width':1}));
    const t = ns('text',{x:pl-8,y:y(v)+4,'text-anchor':'end',fill:'var(--text-3)','font-size':11}); t.textContent=fmt(v); svg.append(t); }
  if(base!=null) svg.append(ns('line',{x1:pl,x2:W-pr,y1:y(base),y2:y(base),stroke:'var(--border-2)','stroke-dasharray':'3 3'}));
  const nx = Math.min(7, n); for(let k=0;k<nx;k++){ const i=Math.round((n-1)*k/(nx-1||1)); const t=ns('text',{x:x(i),y:Hh-8,'text-anchor':k===0?'start':k===nx-1?'end':'middle',fill:'var(--text-3)','font-size':11}); t.textContent = n>40? dates[i].slice(0,7) : dates[i].slice(5); svg.append(t); }
  const defs = ns('defs',{}); svg.append(defs);
  series.slice().reverse().forEach((s, ri) => {
    const pts = s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(pts.length<2) return;
    const d = pts.map((p,k)=>`${k?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    if(area && ri===series.length-1){ const gid='g'+Math.random().toString(36).slice(2); const g=ns('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1}); g.append(ns('stop',{offset:'0%','stop-color':s.color,'stop-opacity':.35}), ns('stop',{offset:'100%','stop-color':s.color,'stop-opacity':0})); defs.append(g);
      const yb = y(base!=null ? base : Ti(lo)); svg.append(ns('path',{d:`${d} L${pts[pts.length-1][0].toFixed(1)},${yb.toFixed(1)} L${pts[0][0].toFixed(1)},${yb.toFixed(1)} Z`, fill:`url(#${gid})`})); }
    svg.append(ns('path',{d, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round'}));
  });
  const cross = ns('line',{x1:0,x2:0,y1:pt,y2:Hh-pb,stroke:'var(--text-3)','stroke-width':1,opacity:0});
  const dots = series.map(s=>ns('circle',{r:4,fill:s.color,stroke:'var(--surface)','stroke-width':2,opacity:0}));
  svg.append(cross, ...dots);
  const tt = $('#tt');
  svg.addEventListener('mousemove', ev => { const r = svg.getBoundingClientRect(); const fx = (ev.clientX - r.left) / r.width * W; const i = Math.max(0, Math.min(n-1, Math.round((fx-pl)/(W-pl-pr)*(n-1))));
    cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i)); cross.setAttribute('opacity',1);
    let html = `<b>${dates[i]}</b>`;
    series.forEach((s,k)=>{ const v=s.values[i]; if(v==null){ dots[k].setAttribute('opacity',0); return; } dots[k].setAttribute('cx',x(i)); dots[k].setAttribute('cy',y(v)); dots[k].setAttribute('opacity',1); html += `<br><span style="color:${s.color}">●</span> ${s.name}: ${fmt(v)}`; });
    if(extra) html += ` <span class="mut">${extra(i)}</span>`;
    tt.innerHTML = html; tt.style.display='block'; tt.style.left = (ev.pageX + 14) + 'px'; tt.style.top = (ev.pageY - 10) + 'px'; });
  svg.addEventListener('mouseleave', ()=>{ tt.style.display='none'; cross.setAttribute('opacity',0); dots.forEach(d=>d.setAttribute('opacity',0)); });
  card.append(svg);
  return card;
}

// ---------------------------------------------------------------- theme toggle (visual only — no data changes)
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); $('#themeLabel').textContent = t==='light' ? 'Light' : 'Dark'; try{ localStorage.setItem('fs_theme', t); }catch(e){} }
applyTheme((()=>{ try{ return localStorage.getItem('fs_theme') || localStorage.getItem('as_theme') || 'dark'; }catch(e){ return 'dark'; } })());
$('#theme').addEventListener('click', ()=>{ applyTheme(document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light'); if(DATA){ const y=window.scrollY; render(); window.scrollTo(0,y); } });

// ---------------------------------------------------------------- refresh with feedback
function nowIST(){ return new Date(Date.now() + 5.5*3600e3); }
function nextBuildIST(){
  const n = nowIST(); const dow = n.getUTCDay(); const mins = n.getUTCHours()*60 + n.getUTCMinutes();
  const slots = []; if(dow>=1 && dow<=5){ for(let m=9*60+30; m<=15*60+30; m+=15) slots.push(m); slots.push(15*60+45); } slots.push(18*60);
  const nxt = slots.find(m=>m>mins); const d = new Date(n);
  if(nxt==null){ d.setUTCDate(d.getUTCDate()+1); const dd=d.getUTCDay(); d.setUTCHours(dd>=1&&dd<=5?9:18, dd>=1&&dd<=5?30:0, 0, 0); } else d.setUTCHours(Math.floor(nxt/60), nxt%60, 0, 0);
  const pad = x=>String(x).padStart(2,'0'); return `${d.getUTCDate()===n.getUTCDate()?'today':'tomorrow'} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} IST`;
}
let toastT; function toast(html){ const t=$('#toast'); t.innerHTML=html; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>{ t.style.display='none'; }, 6000); }
async function refreshNow(){
  const before = DATA && DATA.generated_at_utc; const btn = $('#refresh'); btn.disabled = true; btn.textContent = '↻ Checking…';
  await load(); btn.disabled = false; btn.textContent = '↻ Refresh now'; if(!DATA) return;
  const built = DATA.generated_at_ist.slice(11,16);
  if(DATA.generated_at_utc !== before) toast(`<b>Updated.</b> Showing the build from <b>${built} IST</b> (${DATA.market_status}). Next scheduled build ≈ ${nextBuildIST()}.`);
  else toast(`No newer build yet — latest is <b>${built} IST</b> (${DATA.market_status}). GitHub rebuilds every 15 min in market hours; next ≈ ${nextBuildIST()}. Prices come from Yahoo with a ~15 min delay.`);
  secs = 300;
}
$('#refresh').addEventListener('click', refreshNow);
let secs = 300; setInterval(()=>{ secs--; if(secs<=0){ secs=300; load(); } $('#autoref').textContent = `auto-refresh in ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`; }, 1000);
load();
})();
</script>
